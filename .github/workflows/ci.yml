name: ci

on:
  push:
    branches: [main]
  pull_request:

# 后端质量门禁与 AGENTS PreCompletion / docs/memory/topic-release-audit-test.md 的判绿口径一致：
# ruff → import-linter → mypy（mypy_files.txt 清单）→ 静默捕获棘轮 → 硬编码 → pytest 全量。
# 判绿只看退出码（CI 里 junitxml 四数口径由 pytest 自身退出码承载）。
# Runner 用 windows-latest：工程含 Windows 专属面（system_proxy/WinINET、路径清洗、
# 完整性标签相关测试），ubuntu 上会出与本地无关的红。

jobs:
  backend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: 依赖漏洞审计（pip-audit，2026-10-24 审计卫生项）
        # 扫描的是已装环境（runner 上即 requirements 全集）；需联网查 OSV。
        # 命中公告即红=门禁语义；确需暂缓修复的条目用 --ignore-vuln <ID> 显式
        # 豁免并在本行注释留因——不允许静默放宽。
        run: |
          python -m pip install pip-audit
          python -m pip_audit --skip-editable
      - name: ruff
        run: python -m ruff check app tests
      - name: import-linter
        run: lint-imports
      - name: mypy（mypy_files.txt 契约清单）
        run: python -m mypy @mypy_files.txt
      - name: 静默宽捕获棘轮
        run: python scripts/check_silent_except.py --check
      - name: 硬编码检查
        run: python scripts/check_hardcode.py
      - name: pytest 全量
        env:
          # 临时目录一律仓库外（basetemp 自伤教训：指进仓库会让 find_ffmpeg 扫到假树）
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: python -m pytest tests/ -q --junitxml=${{ runner.temp }}/g-ci.xml

  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        run: npm ci
      - name: tsc
        run: npx tsc --noEmit
      - name: vitest
        run: npm test
      - name: build
        run: npm run build
      - name: wire 合同校验
        run: npm run check:wire
      - name: capability manifest 校验
        run: npm run check:manifest
