name: portable-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag
        required: true
        default: v0.15

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        target:
          - windows-x64-full-rag
          - macos-arm64-full-rag
          - linux-x64-full-rag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 下载已验证的本平台分层资产
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.version }}" --pattern "*${{ matrix.target }}*" --dir release-assets
      - name: 生成用户一键包
        run: |
          if [[ "${{ matrix.target }}" == "windows-x64-full-rag" || "${{ matrix.target }}" == "linux-x64-full-rag" ]] && ! command -v 7z >/dev/null; then
            sudo apt-get update && sudo apt-get install -y p7zip-full
          fi
          if [[ "${{ matrix.target }}" == windows-* ]]; then
            python scripts/portable_release.py build --target "${{ matrix.target }}" --version "${{ inputs.version }}" --assets-dir release-assets --output-dir user-assets --work-dir .portable-work
          else
            python scripts/unix_portable_release.py --target "${{ matrix.target }}" --version "${{ inputs.version }}" --assets-dir release-assets --output-dir user-assets --work-dir .portable-work
          fi
      - name: 上传一键包
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.version }}" user-assets/* --clobber

  cleanup:
    needs: [package]
    runs-on: ubuntu-latest
    steps:
      - name: 清理分层中间产物，Release 只保留用户一键包
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 兼容 draft：按 tag 名从全量 releases 列表过滤，而不是 /releases/tags/{tag}（draft 查不到会 404）
          ids="$(gh api "repos/${{ github.repository }}/releases" \
            --jq '.[] | select(.tag_name == "${{ inputs.version }}") | .assets[] | select(.name | test("^(Demiurge-base-|Demiurge-application-|Demiurge-rag-|Demiurge-update-|join-runtime\\.|Demiurge-00-USER-DOWNLOAD-)")) | .id')"
          for id in $ids; do gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id"; done
          echo "已清理中间产物，保留用户一键包"

  notes:
    needs: [package, cleanup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 更新下载说明
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ inputs.version }}" --notes-file RELEASE_NOTES.md
