name: runtime-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本，例如 v0.14"
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  actions: write
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.11"
      - id: matrix
        shell: bash
        run: echo "matrix=$(python scripts/runtime_release.py matrix)" >> "$GITHUB_OUTPUT"
      - id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: echo "version=${INPUT_VERSION:-$REF_NAME}" >> "$GITHUB_OUTPUT"

  quality:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 后端门禁
        run: |
          python -m pip install -r requirements-dev.txt
          ruff check app tests
          lint-imports
          python -m mypy @mypy_files.txt
          python scripts/check_hardcode.py
          python -m pytest -q
      - name: 前端门禁
        working-directory: frontend
        run: |
          npm ci
          npm run check:wire
          npm run check:manifest
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e

  vendor-closure:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.11"
      - name: 发布闭包门禁
        run: python scripts/release_preflight.py

  desktop-shell:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [plan]
    runs-on: windows-2025
    env:
      # 生产更新密钥只放仓库 Secrets；未配置时构建脚本自动关闭更新产物，
      # 安装器仍可产出，但不会生成 latest.json。
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: 写入运行时交付 pin
        shell: pwsh
        run: >-
          python scripts/runtime_delivery.py pin
          --tag "${{ needs.plan.outputs.version }}"
          --repository "${{ github.repository }}"
      - name: 预置安装器依赖
        run: python scripts/stage_installer_dependencies.py
      - name: 构建两套 NSIS 安装器并核验
        run: >-
          python scripts/build_installers.py --skip-stage
          --version "${{ needs.plan.outputs.version }}"
      - name: 生成自动更新清单
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        run: >-
          python scripts/updater_manifest.py
          --version "${{ needs.plan.outputs.version }}"
          --tag "${{ needs.plan.outputs.version }}"
          --repository "${{ github.repository }}"
          --output "release-output/installers/latest.json"
      - name: 自检桌面壳
        shell: pwsh
        run: |
          $env:DEMIURGE_SHELL_HOME = Join-Path $env:RUNNER_TEMP "demiurge-shell"
          & desktop/tauri/target/release/Demiurge.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "desktop shell self-test failed" }
      - name: 整形便携壳产物
        shell: pwsh
        run: |
          $release = "desktop/tauri/target/release"
          New-Item -ItemType Directory -Force shell-package | Out-Null
          Copy-Item "$release/Demiurge.exe" shell-package/
          if (Test-Path "$release/WebView2Loader.dll") {
            Copy-Item "$release/WebView2Loader.dll" shell-package/
          }
          if (Test-Path "$release/runtimes") {
            Copy-Item -Recurse "$release/runtimes" shell-package/
          }
          Compress-Archive -Path shell-package/* -DestinationPath Demiurge-desktop-windows-x64.zip
          if (-not (Test-Path Demiurge-desktop-windows-x64.zip)) { throw "桌面壳压缩包生成失败" }
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-shell
          path: Demiurge-desktop-windows-x64.zip
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: release-output/installers/*
          if-no-files-found: error
          retention-days: 7

  build:
    needs: [plan, quality, vendor-closure]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-reranker.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 构建固定 Runtime
        shell: pwsh
        run: >-
          python scripts/runtime_release.py build
          --target "${{ matrix.target }}"
          --version "${{ needs.plan.outputs.version }}"
          --output-dir "release-assets"
          --work-dir ".runtime-work/${{ matrix.target }}"
          --install-deps
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [plan, build, desktop-shell]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: 组装 Windows 便携支撑包
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full
          python -c "import zipfile; zipfile.ZipFile('release-assets/Demiurge-desktop-windows-x64.zip').extractall('desktop-shell')"
          python scripts/portable_release.py build --target windows-x64-full-rag --version "${{ needs.plan.outputs.version }}" --assets-dir release-assets --output-dir release-assets --work-dir .portable-work --desktop-dir desktop-shell
      - name: 附加分片合并工具
        run: cp scripts/join-runtime.ps1 scripts/join-runtime.sh release-assets/
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          overwrite_files: true
      - name: 触发全平台用户一键包组装
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run portable-release.yml
          --ref "${{ github.ref_name }}"
          -f version="${{ needs.plan.outputs.version }}"
