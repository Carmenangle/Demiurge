[package]
name = "demiurge-shell"
version = "0.1.0"
edition = "2021"
description = "Demiurge 桌面壳（Tauri 2）：同源 http://127.0.0.1:8010 + 无业务 IPC"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 运行时按需交付：HTTPS 下载走 Windows 原生 TLS（schannel），不引 OpenSSL 工具链。
# ⚠ ureq 的 `native-tls` 特性只拉依赖、不把它设成默认后端（源码原话：never used by
# `ureq::get`），必须在 AgentBuilder 上显式挂 tls_connector，否则 https 一律报
# 「no TLS backend is configured」。这里直接依赖同一个 native-tls 版本给它接线。
ureq = { version = "2.12", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_System_SystemInformation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
] }
tauri-plugin-updater = "2"
base64 = "0.22"
minisign-verify = "0.3"

[features]
# 打发布版时保持 windows 子系统（不弹黑框）；调试版保留控制台便于看日志。
default = []
